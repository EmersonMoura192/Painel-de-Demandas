<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Gestão de Demandas & Desempenho</title>
    <!-- Tailwind CSS para Estilização Profissional -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Cabeçalho Principal / Navbar -->
    <header class="bg-slate-900 text-white shadow-md border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 p-2.5 rounded-xl shadow-lg shadow-blue-500/30">
                    <i class="fa-solid fa-chart-line text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">Portal de Demandas & Desempenho</h1>
                    <p class="text-xs text-slate-400">Controle Operacional Winthor & Logística</p>
                </div>
            </div>
            <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-500 text-white font-medium px-4 py-2.5 rounded-lg transition duration-200 flex items-center justify-center space-x-2 text-sm shadow-md shadow-blue-600/20 active:scale-95">
                <i class="fa-solid fa-plus"></i>
                <span>Nova Demanda</span>
            </button>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
        
        <!-- Dashboard / Cards de Indicadores -->
        <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5 mb-8">
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Total de Demandas</p>
                    <h3 id="stat-total" class="text-3xl font-bold text-slate-800 mt-1">0</h3>
                </div>
                <div class="w-12 h-12 bg-slate-100 text-slate-600 rounded-xl flex items-center justify-center text-lg font-bold">
                    <i class="fa-solid fa-list-check"></i>
                </div>
            </div>

            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-emerald-600 uppercase tracking-wider">Concluídas</p>
                    <h3 id="stat-completed" class="text-3xl font-bold text-emerald-700 mt-1">0</h3>
                </div>
                <div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center text-lg">
                    <i class="fa-solid fa-circle-check"></i>
                </div>
            </div>

            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-amber-600 uppercase tracking-wider">Em Andamento</p>
                    <h3 id="stat-in-progress" class="text-3xl font-bold text-amber-700 mt-1">0</h3>
                </div>
                <div class="w-12 h-12 bg-amber-50 text-amber-600 rounded-xl flex items-center justify-center text-lg">
                    <i class="fa-solid fa-spinner animate-spin"></i>
                </div>
            </div>

            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-blue-600 uppercase tracking-wider">Entrega no Prazo</p>
                    <h3 id="stat-rate" class="text-3xl font-bold text-blue-700 mt-1">100%</h3>
                </div>
                <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center text-lg">
                    <i class="fa-solid fa-bullseye"></i>
                </div>
            </div>
        </section>

        <!-- Filtros e Busca -->
        <section class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm mb-6 flex flex-col md:flex-row gap-4 items-center justify-between">
            <div class="relative w-full md:w-96">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                <input type="text" id="search-input" onkeyup="filterTasks()" placeholder="Buscar por descrição ou solicitante..." class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition">
            </div>

            <div class="flex items-center space-x-3 w-full md:w-auto justify-end">
                <span class="text-xs font-medium text-slate-500">Status:</span>
                <select id="status-filter" onchange="filterTasks()" class="bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500">
                    <option value="ALL">Todos os Status</option>
                    <option value="Em Andamento">Em Andamento</option>
                    <option value="Concluído">Concluído</option>
                    <option value="Planejado">Planejado</option>
                    <option value="Em Revisão">Em Revisão</option>
                    <option value="Cancelado">Cancelado</option>
                </select>
            </div>
        </section>

        <!-- Tabela Responsiva de Tarefas -->
        <section class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                            <th class="py-4 px-4">ID</th>
                            <th class="py-4 px-4">Solicitante</th>
                            <th class="py-4 px-4">Descrição da Tarefa</th>
                            <th class="py-4 px-4">Prioridade</th>
                            <th class="py-4 px-4">Status</th>
                            <th class="py-4 px-4">Prazo</th>
                            <th class="py-4 px-4">Data Entrega</th>
                            <th class="py-4 px-4 text-center">No Prazo?</th>
                            <th class="py-4 px-4 text-center">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="task-table-body" class="divide-y divide-slate-100 text-sm">
                        <!-- Linhas geradas dinamicamente via JS -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- Modal de Nova Tarefa -->
    <div id="task-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-2xl shadow-xl border border-slate-200 w-full max-w-lg overflow-hidden animate-in fade-in zoom-in duration-200">
            <div class="bg-slate-900 px-6 py-4 text-white flex justify-between items-center">
                <h3 class="font-semibold text-lg flex items-center space-x-2">
                    <i class="fa-solid fa-pen-to-square text-blue-400"></i>
                    <span>Cadastrar Nova Demanda</span>
                </h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white text-xl"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="task-form" onsubmit="handleAddTask(event)" class="p-6 space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Solicitante / Origem</label>
                    <input type="text" id="input-solicitante" required placeholder="Ex: Fernandes (TI)" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Descrição da Tarefa</label>
                    <textarea id="input-descricao" required rows="2" placeholder="Ex: Ajustar diárias de balsa da rota Guaraí..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500"></textarea>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Prioridade</label>
                        <select id="input-prioridade" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500">
                            <option value="Alta">Alta</option>
                            <option value="Média" selected>Média</option>
                            <option value="Baixa">Baixa</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Status Inicial</label>
                        <select id="input-status" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500">
                            <option value="Em Andamento">Em Andamento</option>
                            <option value="Planejado">Planejado</option>
                            <option value="Concluído">Concluído</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Prazo Final</label>
                        <input type="date" id="input-prazo" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Data de Entrega (Opcional)</label>
                        <input type="date" id="input-entrega" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500">
                    </div>
                </div>
                <div class="pt-4 flex justify-end space-x-3 border-t border-slate-100">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-xl text-sm font-medium transition">Cancelar</button>
                    <button type="submit" class="px-5 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-sm font-medium shadow-md shadow-blue-500/20 transition">Salvar Demanda</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Dados Iniciais (Armazenados localmente no navegador)
        let tasks = JSON.parse(localStorage.getItem('winthor_tasks')) || [
            { id: "#001", entrada: "2026-10-27", solicitante: "Fernandes (TI)", descricao: "Inclusão de balsa nas diárias (Guaraí e Colinas)", prioridade: "Alta", status: "Em Andamento", prazo: "2026-10-29", entrega: "" },
            { id: "#002", entrada: "2026-10-27", solicitante: "Diretoria / Logística", descricao: "Automação de extração do relatório Winthor", prioridade: "Média", status: "Planejado", prazo: "2026-11-05", entrega: "" },
            { id: "#003", entrada: "2026-10-26", solicitante: "Financeiro", descricao: "Dashboard de controle de fretes e custos", prioridade: "Alta", status: "Concluído", prazo: "2026-10-27", entrega: "2026-10-27" },
            { id: "#004", entrada: "2026-10-25", solicitante: "Gestão", descricao: "Revisão de cadastros de rotas e praças", prioridade: "Baixa", status: "Cancelado", prazo: "2026-10-30", entrega: "" }
        ];

        function saveData() {
            localStorage.setItem('winthor_tasks', JSON.stringify(tasks));
            renderTasks();
            updateMetrics();
        }

        function getStatusBadge(status) {
            const styles = {
                'Concluído': 'bg-emerald-100 text-emerald-800 border-emerald-200',
                'Em Andamento': 'bg-amber-100 text-amber-800 border-amber-200',
                'Planejado': 'bg-blue-100 text-blue-800 border-blue-200',
                'Em Revisão': 'bg-purple-100 text-purple-800 border-purple-200',
                'Cancelado': 'bg-slate-100 text-slate-600 border-slate-200'
            };
            return `<span class="px-2.5 py-1 rounded-full text-xs font-semibold border ${styles[status] || 'bg-slate-100 text-slate-800'}">${status}</span>`;
        }

        function getPriorityBadge(priority) {
            const styles = {
                'Alta': 'bg-red-50 text-red-700 font-bold',
                'Média': 'bg-amber-50 text-amber-700 font-medium',
                'Baixa': 'bg-slate-100 text-slate-600'
            };
            return `<span class="px-2 py-0.5 rounded text-xs ${styles[priority]}">${priority}</span>`;
        }

        function renderTasks() {
            const tbody = document.getElementById('task-table-body');
            tbody.innerHTML = '';

            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const statusFilter = document.getElementById('status-filter').value;

            const filteredTasks = tasks.filter(t => {
                const matchesSearch = t.descricao.toLowerCase().includes(searchTerm) || t.solicitante.toLowerCase().includes(searchTerm);
                const matchesStatus = statusFilter === 'ALL' || t.status === statusFilter;
                return matchesSearch && matchesStatus;
            });

            filteredTasks.forEach((t, index) => {
                let isOnTime = '-';
                if (t.entrega) {
                    isOnTime = t.entrega <= t.prazo 
                        ? '<span class="text-emerald-600 font-bold"><i class="fa-solid fa-check"></i> Sim</span>' 
                        : '<span class="text-red-600 font-bold"><i class="fa-solid fa-xmark"></i> Atrasado</span>';
                }

                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50/80 transition duration-150";
                tr.innerHTML = `
                    <td class="py-3.5 px-4 font-mono font-semibold text-slate-500">${t.id}</td>
                    <td class="py-3.5 px-4 font-medium text-slate-800">${t.solicitante}</td>
                    <td class="py-3.5 px-4 max-w-xs truncate" title="${t.descricao}">${t.descricao}</td>
                    <td class="py-3.5 px-4">${getPriorityBadge(t.prioridade)}</td>
                    <td class="py-3.5 px-4">
                        <select onchange="updateTaskStatus(${index}, this.value)" class="text-xs bg-transparent border-none font-semibold focus:ring-0 cursor-pointer">
                            <option value="Em Andamento" ${t.status === 'Em Andamento' ? 'selected' : ''}>🟡 Em Andamento</option>
                            <option value="Concluído" ${t.status === 'Concluído' ? 'selected' : ''}>🟢 Concluído</option>
                            <option value="Planejado" ${t.status === 'Planejado' ? 'selected' : ''}>🔵 Planejado</option>
                            <option value="Em Revisão" ${t.status === 'Em Revisão' ? 'selected' : ''}>🟣 Em Revisão</option>
                            <option value="Cancelado" ${t.status === 'Cancelado' ? 'selected' : ''}>⚪ Cancelado</option>
                        </select>
                    </td>
                    <td class="py-3.5 px-4 text-slate-600 text-xs">${formatDate(t.prazo)}</td>
                    <td class="py-3.5 px-4 text-xs">
                        <input type="date" value="${t.entrega}" onchange="updateTaskEntrega(${index}, this.value)" class="bg-slate-50 border border-slate-200 rounded px-1.5 py-0.5 text-xs">
                    </td>
                    <td class="py-3.5 px-4 text-center text-xs">${isOnTime}</td>
                    <td class="py-3.5 px-4 text-center">
                        <button onclick="deleteTask(${index})" class="text-slate-400 hover:text-red-600 transition"><i class="fa-solid fa-trash-can"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function updateTaskStatus(index, newStatus) {
            tasks[index].status = newStatus;
            if (newStatus === 'Concluído' && !tasks[index].entrega) {
                tasks[index].entrega = new Date().toISOString().split('T')[0];
            }
            saveData();
        }

        function updateTaskEntrega(index, newDate) {
            tasks[index].entrega = newDate;
            saveData();
        }

        function deleteTask(index) {
            if (confirm("Tem certeza que deseja remover esta demanda?")) {
                tasks.splice(index, 1);
                saveData();
            }
        }

        function updateMetrics() {
            document.getElementById('stat-total').innerText = tasks.length;
            
            const completed = tasks.filter(t => t.status === 'Concluído').length;
            document.getElementById('stat-completed').innerText = completed;

            const inProgress = tasks.filter(t => t.status === 'Em Andamento').length;
            document.getElementById('stat-in-progress').innerText = inProgress;

            const completedTasks = tasks.filter(t => t.status === 'Concluído' && t.entrega);
            if (completedTasks.length > 0) {
                const onTimeCount = completedTasks.filter(t => t.entrega <= t.prazo).length;
                const rate = Math.round((onTimeCount / completedTasks.length) * 100);
                document.getElementById('stat-rate').innerText = `${rate}%`;
            } else {
                document.getElementById('stat-rate').innerText = '100%';
            }
        }

        function handleAddTask(e) {
            e.preventDefault();
            const idNumber = String(tasks.length + 1).padStart(3, '0');
            const newTask = {
                id: `#${idNumber}`,
                entrada: new Date().toISOString().split('T')[0],
                solicitante: document.getElementById('input-solicitante').value,
                descricao: document.getElementById('input-descricao').value,
                prioridade: document.getElementById('input-prioridade').value,
                status: document.getElementById('input-status').value,
                prazo: document.getElementById('input-prazo').value,
                entrega: document.getElementById('input-entrega').value
            };

            tasks.unshift(newTask);
            saveData();
            closeModal();
            document.getElementById('task-form').reset();
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const [year, month, day] = dateStr.split('-');
            return `${day}/${month}/${year}`;
        }

        function filterTasks() { renderTasks(); }
        function openModal() { document.getElementById('task-modal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('task-modal').classList.add('hidden'); }

        // Inicialização
        renderTasks();
        updateMetrics();
    </script>
</body>
</html>
